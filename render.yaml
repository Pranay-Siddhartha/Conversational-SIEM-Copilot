services:
  - type: web
    name: siem-copilot-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: siem-copilot-backend
          type: web
          property: host
        value: https://${RENDER_EXTERNAL_URL}/api
    autoDeploy: true
    staticPublishPath: out
    headers:
      - path: /
        headers:
          - key: Cache-Control
            value: public, max-age=3600

  - type: web
    name: siem-copilot-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siem-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CORS_ORIGINS
        value: https://${RENDER_EXTERNAL_URL}
    autoDeploy: true
    healthCheck:
      path: /docs
      interval: 300
      timeout: 10

databases:
  - name: siem-postgres
    databaseName: siem_copilot
    initializer:
      startCommand: |
        psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
